<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ggtrust System Architecture Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
  }
  .canvas-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    padding: 32px 36px;
    width: 1240px;
  }
  .diagram-header {
    margin-bottom: 24px;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .diagram-title {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
  }
  .diagram-subtitle {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
  }
  .diagram-tag {
    font-size: 11px;
    font-weight: 700;
    background: #eff6ff;
    color: #2563eb;
    border: 1px solid #bfdbfe;
    padding: 4px 10px;
    border-radius: 9999px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<div class="canvas-card">
  <div class="diagram-header">
    <div>
      <div class="diagram-title">System Architecture: The ggtrust Visual Analytics Framework</div>
      <div class="diagram-subtitle">Vectorized Topological Verification Pipeline for High-Dimensional Manifold Projections</div>
    </div>
    <div class="diagram-tag">Editorial Architecture Schema</div>
  </div>

  <svg viewBox="0 0 1160 520" width="1160" height="520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Arrow marker -->
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
      </marker>
    </defs>

    <!-- COLUMN 1: DATA INGESTION LAYER -->
    <g transform="translate(10, 20)">
      <!-- Container -->
      <rect x="0" y="0" width="240" height="460" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <rect x="0" y="0" width="240" height="38" rx="8" fill="#0f172a" />
      <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="0.04em">1. DATA INGESTION LAYER</text>

      <!-- Card 1A: High-D Feature Space -->
      <g transform="translate(14, 52)">
        <rect x="0" y="0" width="212" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <rect x="0" y="0" width="4" height="110" rx="2" fill="#2563eb" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">High-D Input Matrix (X)</text>
        <text x="14" y="40" fill="#64748b" font-size="11">R^(N × D) Continuous Manifold</text>
        <line x1="14" y1="48" x2="198" y2="48" stroke="#f1f5f9" stroke-width="1" />
        <text x="14" y="66" fill="#334155" font-size="10.5">• scRNA-seq: 500 cells × 20 genes</text>
        <text x="14" y="82" fill="#334155" font-size="10.5">• MNIST Digits: 400 × 64 pixels</text>
        <text x="14" y="98" fill="#334155" font-size="10.5">• Wine Quality: 178 × 13 features</text>
      </g>

      <!-- Card 1B: Low-D Embedding Coordinates -->
      <g transform="translate(14, 178)">
        <rect x="0" y="0" width="212" height="110" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <rect x="0" y="0" width="4" height="110" rx="2" fill="#059669" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">Projected Embedding (Y)</text>
        <text x="14" y="40" fill="#64748b" font-size="11">R^(N × 2) Cartesian Coordinates</text>
        <line x1="14" y1="48" x2="198" y2="48" stroke="#f1f5f9" stroke-width="1" />
        <text x="14" y="66" fill="#334155" font-size="10.5">• t-SNE Non-Linear Manifold</text>
        <text x="14" y="82" fill="#334155" font-size="10.5">• UMAP Fuzzy Simplicial Set</text>
        <text x="14" y="98" fill="#334155" font-size="10.5">• PCA Orthogonal Eigen-planes</text>
      </g>

      <!-- Card 1C: Ground Truth Metadata -->
      <g transform="translate(14, 304)">
        <rect x="0" y="0" width="212" height="130" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <rect x="0" y="0" width="4" height="130" rx="2" fill="#d97706" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">Metadata Annotations</text>
        <text x="14" y="40" fill="#64748b" font-size="11">Categorical & Lineage Labels</text>
        <line x1="14" y1="48" x2="198" y2="48" stroke="#f1f5f9" stroke-width="1" />
        <text x="14" y="66" fill="#334155" font-size="10.5">• CD4+ / CD8+ T-Cell Lineages</text>
        <text x="14" y="82" fill="#334155" font-size="10.5">• B-Cells, Monocytes, NK Cells</text>
        <text x="14" y="98" fill="#334155" font-size="10.5">• Unique Observation Identifiers</text>
        <text x="14" y="114" fill="#64748b" font-size="9.5">ID: CELL_001 ... CELL_500</text>
      </g>
    </g>

    <!-- Connector: Col 1 -> Col 2 -->
    <path d="M 250 150 L 298 150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 250 240 L 298 240" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- COLUMN 2: VECTORIZED MATHEMATICAL ENGINE -->
    <g transform="translate(305, 20)">
      <rect x="0" y="0" width="270" height="460" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <rect x="0" y="0" width="270" height="38" rx="8" fill="#0f172a" />
      <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="0.04em">2. VECTORIZED METRIC ENGINE</text>

      <!-- Box 2A: Metric Distance Computation -->
      <g transform="translate(14, 52)">
        <rect x="0" y="0" width="242" height="95" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">Pairwise Distance Matrices</text>
        <text x="14" y="38" fill="#2563eb" font-size="11" font-family="monospace">D_orig = cdist(X, X)</text>
        <text x="14" y="54" fill="#2563eb" font-size="11" font-family="monospace">D_emb  = cdist(Y, Y)</text>
        <text x="14" y="74" fill="#64748b" font-size="10.5">Diagonal clamped to infinity (self-exclusion)</text>
        <text x="14" y="88" fill="#64748b" font-size="10.5">Execution speed: 0.046s for N=500</text>
      </g>

      <!-- Box 2B: Rank Sort & Neighbor Lookup -->
      <g transform="translate(14, 160)">
        <rect x="0" y="0" width="242" height="95" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">Dual Neighborhood Ranks</text>
        <text x="14" y="40" fill="#334155" font-size="10.5">• ord_o = argsort(D_orig, axis=1)</text>
        <text x="14" y="56" fill="#334155" font-size="10.5">• ord_e = argsort(D_emb, axis=1)</text>
        <text x="14" y="72" fill="#334155" font-size="10.5">• Dual Rank Inversion (1-based)</text>
        <text x="14" y="88" fill="#64748b" font-size="10">U_k(i) in 2D vs V_k(i) in High-D</text>
      </g>

      <!-- Box 2C: Venna-Kaski Formulations -->
      <g transform="translate(14, 268)">
        <rect x="0" y="0" width="242" height="175" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">Fidelity Formulations</text>
        
        <text x="14" y="42" fill="#dc2626" font-size="11" font-weight="700">Trustworthiness T(k, i):</text>
        <text x="14" y="58" fill="#334155" font-size="10">1 - [2/denom] * sum(inv_o[i, jT] - k)</text>
        <text x="14" y="72" fill="#64748b" font-size="9.5">Penalizes False Intrusions (Impostors)</text>

        <text x="14" y="95" fill="#d97706" font-size="11" font-weight="700">Continuity C(k, i):</text>
        <text x="14" y="111" fill="#334155" font-size="10">1 - [2/denom] * sum(inv_e[i, jC] - k)</text>
        <text x="14" y="125" fill="#64748b" font-size="9.5">Penalizes Cluster Tearing (Exiles)</text>

        <line x1="14" y1="135" x2="228" y2="135" stroke="#f1f5f9" stroke-width="1" />
        <text x="14" y="152" fill="#059669" font-size="11" font-weight="700">Composite Metric S_i:</text>
        <text x="14" y="166" fill="#334155" font-size="10">S_i = min(T(k, i), C(k, i)) [Safety-First]</text>
      </g>
    </g>

    <!-- Connector: Col 2 -> Col 3 -->
    <path d="M 575 240 L 618 240" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- COLUMN 3: TYPOLOGY & MULTI-SCALE CORE -->
    <g transform="translate(625, 20)">
      <rect x="0" y="0" width="245" height="460" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
      <rect x="0" y="0" width="245" height="38" rx="8" fill="#0f172a" />
      <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="0.04em">3. TYPOLOGY & SCALING</text>

      <!-- 4-Quadrant Typology Card -->
      <g transform="translate(14, 52)">
        <rect x="0" y="0" width="217" height="230" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">4-Quadrant Typology</text>
        <text x="14" y="38" fill="#64748b" font-size="10.5">Adaptive quantiles: tau_T, tau_C</text>

        <!-- Quadrant mini grid -->
        <g transform="translate(14, 48)">
          <!-- Top Left: Impostor -->
          <rect x="0" y="0" width="90" height="52" rx="4" fill="#fef2f2" stroke="#fecaca" />
          <text x="6" y="16" fill="#991b1b" font-size="9" font-weight="700">FALSE IMPOSTOR</text>
          <text x="6" y="30" fill="#7f1d1d" font-size="8.5">Low T, High C</text>
          <text x="6" y="44" fill="#b91c1c" font-size="8">False Intrusions</text>

          <!-- Top Right: Faithful -->
          <rect x="98" y="0" width="90" height="52" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
          <text x="6" y="16" fill="#166534" font-size="9" font-weight="700" transform="translate(98, 0)">FAITHFUL ANCHOR</text>
          <text x="6" y="30" fill="#14532d" font-size="8.5" transform="translate(98, 0)">High T, High C</text>
          <text x="6" y="44" fill="#15803d" font-size="8" transform="translate(98, 0)">Safe Discovery</text>

          <!-- Bottom Left: Critical -->
          <rect x="0" y="60" width="90" height="52" rx="4" fill="#f5f3ff" stroke="#ddd6fe" />
          <text x="6" y="16" fill="#5b21b6" font-size="9" font-weight="700" transform="translate(0, 60)">CRITICAL ARTIFACT</text>
          <text x="6" y="30" fill="#4c1d95" font-size="8.5" transform="translate(0, 60)">Low T, Low C</text>
          <text x="6" y="44" fill="#6d28d9" font-size="8" transform="translate(0, 60)">Severe Void</text>

          <!-- Bottom Right: Exile -->
          <rect x="98" y="60" width="90" height="52" rx="4" fill="#fffbeb" stroke="#fde68a" />
          <text x="6" y="16" fill="#92400e" font-size="9" font-weight="700" transform="translate(98, 60)">TORN EXILE</text>
          <text x="6" y="30" fill="#78350f" font-size="8.5" transform="translate(98, 60)">High T, Low C</text>
          <text x="6" y="44" fill="#b45309" font-size="8" transform="translate(98, 60)">Torn Cluster</text>
        </g>
        <text x="14" y="185" fill="#64748b" font-size="10">Classifies failure etiology:</text>
        <text x="14" y="200" fill="#334155" font-size="10">• CD8+ T-cells: Impostor (16.4%)</text>
        <text x="14" y="215" fill="#334155" font-size="10">• CD4+ Memory: Torn Exile (16.4%)</text>
      </g>

      <!-- Multi-Scale Engine -->
      <g transform="translate(14, 294)">
        <rect x="0" y="0" width="217" height="145" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="22" fill="#0f172a" font-size="12" font-weight="700">Multi-Scale Horizon</text>
        <text x="14" y="38" fill="#64748b" font-size="10.5">k-Spectrum Resolution Sweep</text>
        <line x1="14" y1="46" x2="203" y2="46" stroke="#f1f5f9" stroke-width="1" />
        <text x="14" y="64" fill="#334155" font-size="10.5">• Evaluates k in [3, 45] (15 steps)</text>
        <text x="14" y="80" fill="#334155" font-size="10.5">• Tracks micro-to-macro stability</text>
        <text x="14" y="96" fill="#334155" font-size="10.5">• Lineage-specific stability curves</text>
        <text x="14" y="114" fill="#2563eb" font-size="10">• Solid: Trustworthiness T(k)</text>
        <text x="14" y="130" fill="#2563eb" font-size="10">• Dashed: Continuity C(k)</text>
      </g>
    </g>

    <!-- Connector: Col 3 -> Col 4 -->
    <path d="M 870 240 L 908 240" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)" />

    <!-- COLUMN 4: VISUAL ANALYTICS PLATFORM (STREAMLIT + PLOTLY) -->
    <g transform="translate(915, 20)">
      <rect x="0" y="0" width="235" height="460" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
      <rect x="0" y="0" width="235" height="38" rx="8" fill="#1e3a8a" />
      <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700" letter-spacing="0.04em">4. VISUAL ANALYTICS UI</text>

      <!-- Visualization Techniques Stack -->
      <g transform="translate(12, 50)">
        <rect x="0" y="0" width="211" height="70" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="17" fill="#1e40af" font-size="11" font-weight="700">Technique 1: Visual Encodings</text>
        <text x="10" y="32" fill="#334155" font-size="9.5">• Concentric Gaussian Halos</text>
        <text x="10" y="46" fill="#334155" font-size="9.5">• Density Surface, Alpha Saliency</text>
        <text x="10" y="60" fill="#334155" font-size="9.5">• Crosshairs, Hybrid Layering</text>
      </g>

      <g transform="translate(12, 126)">
        <rect x="0" y="0" width="211" height="66" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="17" fill="#1e40af" font-size="11" font-weight="700">Technique 2: Micro-Inspector Lens</text>
        <text x="10" y="32" fill="#334155" font-size="9.5">• Elastic True-Neighbor Tethers</text>
        <text x="10" y="46" fill="#334155" font-size="9.5">• Red 2D Impostor Warning Rings</text>
        <text x="10" y="60" fill="#334155" font-size="9.5">• Diagnostic Dossier Card</text>
      </g>

      <g transform="translate(12, 198)">
        <rect x="0" y="0" width="211" height="66" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="17" fill="#1e40af" font-size="11" font-weight="700">Techniques 3 & 4: Phase Horizons</text>
        <text x="10" y="32" fill="#334155" font-size="9.5">• 4-Quadrant Phase Scatter Plane</text>
        <text x="10" y="46" fill="#334155" font-size="9.5">• Lineage Breakdown Stacked Bars</text>
        <text x="10" y="60" fill="#334155" font-size="9.5">• Multi-Scale Stability Spectrum</text>
      </g>

      <g transform="translate(12, 270)">
        <rect x="0" y="0" width="211" height="66" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="17" fill="#1e40af" font-size="11" font-weight="700">Techniques 5A & 5B: High-D Manifold</text>
        <text x="10" y="32" fill="#334155" font-size="9.5">• Parallel Coordinates Plot (PCP)</text>
        <text x="10" y="46" fill="#334155" font-size="9.5">• Co-Ranking Deviation Heatmap</text>
        <text x="10" y="60" fill="#334155" font-size="9.5">• Shepard Distance Diagram</text>
      </g>

      <g transform="translate(12, 342)">
        <rect x="0" y="0" width="211" height="106" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="17" fill="#1e40af" font-size="11" font-weight="700">Techniques 6, 7 & 8: Support & Code</text>
        <text x="10" y="32" fill="#334155" font-size="9.5">• Dual-Canvas Comparative Validation</text>
        <text x="10" y="46" fill="#334155" font-size="9.5">• Python Scanpy & R Code Generator</text>
        <text x="10" y="60" fill="#334155" font-size="9.5">• Diagnostic Table Micro-Bars</text>
        <text x="10" y="74" fill="#334155" font-size="9.5">• Clinical Risk Radar Profile</text>
        <text x="10" y="90" fill="#059669" font-size="9.5" font-weight="700">• One-Click CSV Metric Export</text>
      </g>
    </g>
  </svg>
</div>

</body>
</html>
